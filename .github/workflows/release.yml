name: Validate localization
on:
  push:
    branches: [api13-zh-tw]
  pull_request:
    branches: [api13-zh-tw]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet run --project tests/LocalizationChecks.csproj -c Release
# Build plugin releases with scripts/Build-Api13.ps1 and an explicit API 13 SDK.
